---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Shattered Vales OS for machines with AMD/Intel graphics.
# All shared configuration lives in recipes/common so the base and NVIDIA
# images can never drift apart; only the base image differs.
name: shatteredvales-os
description: Shattered Vales Studio workstation image (AMD/Intel graphics)

# BlueBuild's base images carry codecs (negativo17), ublue udev rules and
# QoL tooling, and are published as a matched mesa / NVIDIA pair from one
# recipe set. Universal Blue retired its NVIDIA Silverblue images in 2025.
base-image: ghcr.io/blue-build/base-images/fedora-silverblue
# Pinned so a Fedora major release is an explicit, tested change rather than
# something that lands on every workstation overnight.
image-version: 45

modules:
  - from-file: common/files.yml
  - from-file: common/packages.yml
  - from-file: common/extras.yml
  - from-file: common/desktop.yml
  - from-file: common/branding.yml
  - from-file: common/flatpaks.yml
  - from-file: common/services.yml
  - from-file: common/finalize.yml

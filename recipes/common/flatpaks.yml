---
# GUI apps installed from Flathub on first boot. Flatpaks update
# independently of the image and keep their sandboxes, which suits
# consumer apps and large creative tools better than layering them as RPMs.
modules:
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          # Core GNOME apps. Fedora's own installer adds these to Silverblue,
          # but this image is installed from a container, so without them
          # there would be no image, PDF or video viewer, text editor or
          # archive manager. Fedora's default file associations expect them.
          - org.gnome.Loupe
          - org.gnome.Papers
          - org.gnome.Showtime
          - org.gnome.Decibels
          - org.gnome.TextEditor
          - org.gnome.Calculator
          - org.gnome.Calendar
          - org.gnome.Characters
          - org.gnome.clocks
          - org.gnome.Snapshot
          - org.gnome.FileRoller
          - org.gnome.baobab
          - org.gnome.font-viewer
          - org.gnome.Logs
          - org.gnome.SimpleScan
          # Studio apps
          - com.valvesoftware.Steam
          - com.bitwarden.desktop
          - com.obsproject.Studio
          - org.remmina.Remmina
          - com.mattjakeman.ExtensionManager
          - com.github.tchx84.Flatseal
          # Art, audio and engines
          - org.blender.Blender
          - org.kde.krita
          - org.gimp.GIMP
          - org.inkscape.Inkscape
          - org.audacityteam.Audacity
          # The .NET build of Godot also runs GDScript projects.
          - org.godotengine.GodotSharp
          # Android / WearOS and VR
          - com.google.AndroidStudio
          # Streams PC VR to Quest headsets over Wi-Fi.
          - io.github.wivrn.wivrn
          # Web and desktop app development
          - com.getpostman.Postman
          - io.dbeaver.DBeaverCommunity
          - io.qt.QtCreator
          # GUI for Podman (in the base) and the Docker Engine socket.
          - io.podman_desktop.PodmanDesktop
          # GUI for the Distrobox in the base image, for Ubuntu-only SDKs.
          - io.github.dvlv.boxbuddyrs
          # Game asset and level tools
          - org.mapeditor.Tiled
          - io.github.f3d_app.f3d
          # Annotated screenshots for bug reports and QA
          - org.flameshot.Flameshot
          # Remote playtesting
          - com.parsecgaming.parsec
          # Team communication
          - com.slack.Slack
          - com.discordapp.Discord

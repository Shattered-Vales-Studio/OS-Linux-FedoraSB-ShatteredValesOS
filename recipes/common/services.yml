---
modules:
  - type: systemd
    system:
      enabled:
        - docker.socket
        - tailscaled.service
        - sshd.service
        - shatteredvales-groups.service
        - shatteredvales-gpu-check.service
    user:
      enabled:
        # Nudges people to restart when an OS update has waited 3+ days.
        - shatteredvales-update-reminder.timer

---
# Studio services, enabled on top of Core's (Tailscale, GPU check, signed
# switch, boot menu theme, update reminder).
modules:
  - type: systemd
    system:
      enabled:
        - docker.socket
        # Remote access for IT and between studio machines; Core leaves
        # sshd off.
        - sshd.service
        - shatteredvales-groups.service

---
# Studio packages layered over Core's (Tailscale, Thunderbird, the dock
# extensions and the support tools come from Core). Anything here updates
# with the image itself, so it must not be a tool that self-updates in place.
modules:
  - type: dnf
    repos:
      files:
        - https://download.docker.com/linux/fedora/docker-ce.repo
        # Community repackage of Anthropic's official Linux .deb; Anthropic
        # only publishes an apt repository for the Linux beta.
        - https://pkg.claude-desktop-debian.dev/rpm/claude-desktop-unofficial.repo
    # Unity Hub installs into /opt. BlueBuild (CLI 0.9.23+) relocates /opt
    # payloads into /usr/lib/opt for every module automatically, so no
    # optfix entry is needed; the release gate checks the result.
    install:
      packages:
        # Container runtime (Docker Engine is free; Docker Desktop is not)
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
        # Development
        - golang
        # Silverblue ships only git-core; the full package adds the perl,
        # email and subtree helpers developers expect.
        - git
        - git-lfs
        - code
        - unityhub
        # Claude Desktop (Claude Code CLI is installed per user at first login)
        - claude-desktop-unofficial

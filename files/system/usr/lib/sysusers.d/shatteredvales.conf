# Groups that workstation users are added to by shatteredvales-groups.service.
#
# docker-ce creates its group with groupadd in an RPM scriptlet, which only
# reaches /etc/group inside the image build. Machines that rebase onto the
# image keep their own /etc/group, so without this entry the group never
# exists there and nobody can use Docker without sudo. systemd-sysusers runs
# at every boot and creates the group if it is missing.
g docker -

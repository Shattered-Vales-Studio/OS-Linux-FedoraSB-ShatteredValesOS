# Homebrew's prefix for Linux. Bottles (prebuilt packages) are only built for
# /home/linuxbrew/.linuxbrew, so any other location compiles everything from
# source. /home is /var/home on Fedora Atomic and creating a folder there
# needs root, so systemd-tmpfiles creates the parent at boot. It is writable
# by administrators (wheel, setgid), so the first administrator who logs in
# creates .linuxbrew and owns Homebrew: Homebrew allows one owner per prefix.
# Accounts listed in /etc/shatteredvales/homebrew-skip-users (the OS
# installer adds its IT account there) never claim it.
d /var/home/linuxbrew 2775 root wheel -

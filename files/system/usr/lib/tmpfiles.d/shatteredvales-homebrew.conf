# Homebrew's prefix for Linux. Bottles (prebuilt packages) are only built for
# /home/linuxbrew/.linuxbrew, so any other location compiles everything from
# source. /home is /var/home on Fedora Atomic and creating a folder there
# needs root, so systemd-tmpfiles creates it at boot. Homebrew allows one
# owner per prefix; it belongs to the workstation's primary account (UID
# 1000, the account the installer creates). Other accounts can run the
# installed tools but not install new ones.
d /var/home/linuxbrew 0755 1000 1000 -
